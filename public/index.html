<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Best Buy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f0f0f0; }

    header {
      background: #0046be;
      color: white;
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.5em; }
    .cart-icon {
      background: #ffed00;
      color: #0046be;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95em;
    }

    .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }

    h2 { color: #333; margin-bottom: 20px; font-size: 1.3em; }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .product-card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .product-card .category {
      font-size: 0.75em;
      color: #0046be;
      font-weight: bold;
      text-transform: uppercase;
    }
    .product-card h3 { font-size: 1em; color: #222; }
    .product-card p  { font-size: 0.85em; color: #666; flex: 1; }
    .product-card .price { font-size: 1.4em; font-weight: bold; color: #0046be; }
    .product-card .stock { font-size: 0.8em; color: #28a745; }

    .btn-add {
      background: #0046be;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9em;
      margin-top: 5px;
    }
    .btn-add:hover { background: #003399; }
    .btn-add:disabled { background: #ccc; cursor: not-allowed; }

    /* Cart Panel */
    .cart-panel {
      background: white;
      border-radius: 8px;
      padding: 25px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      margin-bottom: 30px;
      display: none;
    }
    .cart-panel.open { display: block; }
    .cart-panel h2 { color: #0046be; margin-bottom: 15px; }

    .cart-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 0.9em;
    }
    .cart-total {
      text-align: right;
      font-size: 1.2em;
      font-weight: bold;
      color: #0046be;
      margin: 15px 0;
    }

    .checkout-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .checkout-form input {
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 0.9em;
      flex: 1;
      min-width: 180px;
    }
    .btn-checkout {
      background: #ffed00;
      color: #0046be;
      border: none;
      padding: 10px 25px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95em;
    }
    .btn-checkout:hover { background: #e6d800; }
    .btn-clear {
      background: #dc3545;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.9em;
    }

    #orderMessage {
      padding: 12px 18px;
      border-radius: 6px;
      margin-top: 15px;
      display: none;
      font-weight: bold;
    }
    #orderMessage.success { background: #d4edda; color: #155724; display: block; }
    #orderMessage.error   { background: #f8d7da; color: #721c24; display: block; }

    .empty-cart { color: #999; text-align: center; padding: 20px; }
  </style>
</head>
<body>

<header>
  <h1>🛒 Best Buy</h1>
  <div class="cart-icon" onclick="toggleCart()">
    🛍️ Cart (<span id="cartCount">0</span>)
  </div>
</header>

<div class="container">

  <!-- Cart Panel -->
  <div class="cart-panel" id="cartPanel">
    <h2>🛍️ Your Cart</h2>
    <div id="cartItems"><p class="empty-cart">Your cart is empty</p></div>
    <div class="cart-total">Total: $<span id="cartTotal">0.00</span></div>
    <div class="checkout-form">
      <input id="customerName"  placeholder="Your full name" />
      <input id="customerEmail" placeholder="Email address" type="email"/>
      <button class="btn-checkout" onclick="placeOrder()">✓ Place Order</button>
      <button class="btn-clear"   onclick="clearCart()">Clear Cart</button>
    </div>
    <div id="orderMessage"></div>
  </div>

  <!-- Products -->
  <h2>Featured Products</h2>
  <div id="productGrid" class="product-grid">
    <p style="color:#999">Loading products...</p>
  </div>

</div>

<script>
  const PRODUCT_API = window.PRODUCT_SERVICE_URL || 'http://localhost:3001';
  const ORDER_API   = window.ORDER_SERVICE_URL   || 'http://localhost:3000';

  let cart = [];

  // ── Cart UI ──────────────────────────────────────────────
  function toggleCart() {
    document.getElementById('cartPanel').classList.toggle('open');
  }

  function updateCartUI() {
    document.getElementById('cartCount').textContent = cart.length;
    const total = cart.reduce((sum, i) => sum + i.price * i.quantity, 0);
    document.getElementById('cartTotal').textContent = total.toFixed(2);

    const el = document.getElementById('cartItems');
    if (cart.length === 0) {
      el.innerHTML = '<p class="empty-cart">Your cart is empty</p>';
      return;
    }
    el.innerHTML = cart.map((item, idx) => `
      <div class="cart-item">
        <span>${item.productName} x${item.quantity}</span>
        <span>
          $${(item.price * item.quantity).toFixed(2)}
          <button onclick="removeFromCart(${idx})"
            style="background:none;border:none;color:red;cursor:pointer;margin-left:8px">✕</button>
        </span>
      </div>
    `).join('');
  }

  function addToCart(product) {
    const existing = cart.find(i => i.productId === product._id);
    if (existing) {
      existing.quantity++;
    } else {
      cart.push({
        productId:   product._id,
        productName: product.name,
        quantity:    1,
        price:       product.price
      });
    }
    updateCartUI();

    // Open cart automatically
    document.getElementById('cartPanel').classList.add('open');
  }

  function removeFromCart(idx) {
    cart.splice(idx, 1);
    updateCartUI();
  }

  function clearCart() {
    cart = [];
    updateCartUI();
  }

  // ── Products ─────────────────────────────────────────────
  async function loadProducts() {
    try {
      const res = await fetch(`${PRODUCT_API}/products`);
      const products = await res.json();

      const grid = document.getElementById('productGrid');
      if (products.length === 0) {
        grid.innerHTML = '<p style="color:#999">No products available</p>';
        return;
      }

      grid.innerHTML = products.map(p => `
        <div class="product-card">
          <span class="category">${p.category}</span>
          <h3>${p.name}</h3>
          <p>${p.description}</p>
          <span class="price">$${p.price.toFixed(2)}</span>
          <span class="stock">${p.stock > 0 ? `✓ In Stock (${p.stock})` : '✗ Out of Stock'}</span>
          <button class="btn-add"
            onclick='addToCart(${JSON.stringify(p)})'
            ${p.stock === 0 ? 'disabled' : ''}>
            Add to Cart
          </button>
        </div>
      `).join('');
    } catch (err) {
      document.getElementById('productGrid').innerHTML =
        '<p style="color:red">Could not load products. Please try again later.</p>';
    }
  }

  // ── Checkout ─────────────────────────────────────────────
  async function placeOrder() {
    const customerName  = document.getElementById('customerName').value.trim();
    const customerEmail = document.getElementById('customerEmail').value.trim();
    const msgEl = document.getElementById('orderMessage');

    if (!customerName) {
      msgEl.textContent = '⚠️ Please enter your name';
      msgEl.className = 'error';
      return;
    }
    if (cart.length === 0) {
      msgEl.textContent = '⚠️ Your cart is empty';
      msgEl.className = 'error';
      return;
    }

    const total = cart.reduce((sum, i) => sum + i.price * i.quantity, 0);

    try {
      const res = await fetch(`${ORDER_API}/orders`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ customerName, customerEmail, items: cart, total })
      });

      if (res.ok) {
        const order = await res.json();
        msgEl.textContent = `✅ Order placed! Your order ID: ${order._id.slice(-8).toUpperCase()}`;
        msgEl.className = 'success';
        clearCart();
        document.getElementById('customerName').value  = '';
        document.getElementById('customerEmail').value = '';
      } else {
        throw new Error('Order failed');
      }
    } catch (err) {
      msgEl.textContent = '❌ Could not place order. Please try again.';
      msgEl.className = 'error';
    }
  }

  // Load products on start
  loadProducts();
</script>
</body>
</html>
